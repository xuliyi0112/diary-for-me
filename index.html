<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PM日记">
<link rel="manifest" href="manifest.json">
<title>PM 日记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --ease: cubic-bezier(0.4,0,0.2,1);
  --ease-spring: cubic-bezier(0.34,1.3,0.64,1);
  --ease-out: cubic-bezier(0,0,0.2,1);
  --serif: 'Noto Serif SC', Georgia, serif;
  --sans:  'Noto Sans SC', system-ui, sans-serif;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   六个时间段主题
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

/* 🌅 凌晨 (0–5)  深蓝星空 */
.theme-midnight{
  --bg:#0d1117; --bg2:#141b23; --bg3:#1c2531; --bg4:#232e3d;
  --t1:#e8edf3; --t2:#8a96a6; --t3:#4a5568; --t4:#2d3748;
  --accent:#6b8cba; --accent2:#7a9db8; --warm:#8b7a9e; --sand:#7a8fa8; --sage:#6b8c8a; --lavender:#8b82b4;
  --bd:rgba(100,130,160,0.10); --bd2:rgba(100,130,160,0.15); --bd3:rgba(100,130,160,0.22);
  --sh-sm:0 1px 4px rgba(0,0,0,0.3),0 2px 12px rgba(0,0,0,0.2);
  --sh-md:0 4px 20px rgba(0,0,0,0.4),0 1px 4px rgba(0,0,0,0.3);
  --card-bg:rgba(20,27,35,0.78); --card-bg2:rgba(28,37,49,0.72);
  --nav-bg:rgba(13,17,23,0.92); --bottom-bg:rgba(13,17,23,0.90);
  --ep-bg:#0d1117; --search-bg:rgba(20,27,35,0.72);
  --w1:rgba(60,90,140,0.18); --w2:rgba(80,60,120,0.14); --w3:rgba(40,60,90,0.12);
  --thumb-scale:1;
  --status-style:black-translucent;
}

/* 🌄 清晨 (5–8)  橘粉晨光 */
.theme-dawn{
  --bg:#fdf6f0; --bg2:#faeee4; --bg3:#f5e3d3; --bg4:#efd8c4;
  --t1:#2d2018; --t2:#7a5e4a; --t3:#b89a82; --t4:#d4c4b4;
  --accent:#d4845a; --accent2:#e8a87c; --warm:#c8705a; --sand:#e8b870; --sage:#8aaa88; --lavender:#9e8ab4;
  --bd:rgba(100,60,30,0.08); --bd2:rgba(100,60,30,0.12); --bd3:rgba(100,60,30,0.18);
  --sh-sm:0 1px 4px rgba(160,80,40,0.08),0 2px 12px rgba(160,80,40,0.05);
  --sh-md:0 4px 20px rgba(160,80,40,0.10),0 1px 4px rgba(160,80,40,0.06);
  --card-bg:rgba(255,252,248,0.82); --card-bg2:rgba(255,248,240,0.72);
  --nav-bg:rgba(253,246,240,0.92); --bottom-bg:rgba(253,246,240,0.90);
  --ep-bg:#fdf6f0; --search-bg:rgba(255,252,248,0.78);
  --w1:rgba(255,160,90,0.18); --w2:rgba(255,120,80,0.14); --w3:rgba(255,200,140,0.16);
  --thumb-scale:1;
}

/* ☀️ 上午 (8–12)  明亮清爽 */
.theme-morning{
  --bg:#f7fbfc; --bg2:#edf5f8; --bg3:#deedf3; --bg4:#cfe4ec;
  --t1:#1a2e36; --t2:#4a6e7a; --t3:#8aaab6; --t4:#c0d8e0;
  --accent:#3d8fa8; --accent2:#5aab9e; --warm:#d4886a; --sand:#d4b060; --sage:#6aaa88; --lavender:#8a88c0;
  --bd:rgba(30,80,100,0.07); --bd2:rgba(30,80,100,0.11); --bd3:rgba(30,80,100,0.16);
  --sh-sm:0 1px 4px rgba(30,80,100,0.06),0 2px 12px rgba(30,80,100,0.04);
  --sh-md:0 4px 20px rgba(30,80,100,0.08),0 1px 4px rgba(30,80,100,0.05);
  --card-bg:rgba(255,255,255,0.82); --card-bg2:rgba(240,250,255,0.72);
  --nav-bg:rgba(247,251,252,0.92); --bottom-bg:rgba(247,251,252,0.90);
  --ep-bg:#f7fbfc; --search-bg:rgba(255,255,255,0.78);
  --w1:rgba(60,160,200,0.14); --w2:rgba(80,190,180,0.11); --w3:rgba(40,140,180,0.10);
  --thumb-scale:1;
}

/* 🌿 下午 (12–17)  温暖大地 */
.theme-afternoon{
  --bg:#faf8f4; --bg2:#f3f0ea; --bg3:#ebe6dc; --bg4:#e2ddd4;
  --t1:#2c2820; --t2:#7a6f63; --t3:#b0a89c; --t4:#d4cec6;
  --accent:#5b8fa8; --accent2:#7ba89a; --warm:#c9896a; --sand:#d4a96a; --sage:#8da888; --lavender:#9b8db4;
  --bd:rgba(44,40,32,0.07); --bd2:rgba(44,40,32,0.11); --bd3:rgba(44,40,32,0.16);
  --sh-sm:0 1px 4px rgba(44,40,32,0.06),0 2px 12px rgba(44,40,32,0.04);
  --sh-md:0 4px 20px rgba(44,40,32,0.09),0 1px 4px rgba(44,40,32,0.05);
  --card-bg:rgba(255,255,255,0.78); --card-bg2:rgba(250,248,244,0.72);
  --nav-bg:rgba(250,248,244,0.92); --bottom-bg:rgba(250,248,244,0.90);
  --ep-bg:#faf8f4; --search-bg:rgba(255,255,255,0.72);
  --w1:rgba(91,143,168,0.10); --w2:rgba(141,168,136,0.09); --w3:rgba(201,137,106,0.07);
  --thumb-scale:1;
}

/* 🌇 黄昏 (17–20)  暖橙日落 */
.theme-dusk{
  --bg:#1e1410; --bg2:#261a12; --bg3:#30221a; --bg4:#3a2a20;
  --t1:#f2e8d8; --t2:#c4a880; --t3:#7a6050; --t4:#4a3828;
  --accent:#e8945a; --accent2:#d4b880; --warm:#e87050; --sand:#e0a860; --sage:#8aaa78; --lavender:#c090b0;
  --bd:rgba(240,180,100,0.10); --bd2:rgba(240,180,100,0.15); --bd3:rgba(240,180,100,0.22);
  --sh-sm:0 1px 4px rgba(0,0,0,0.3),0 2px 12px rgba(0,0,0,0.2);
  --sh-md:0 4px 20px rgba(0,0,0,0.4),0 1px 4px rgba(0,0,0,0.3);
  --card-bg:rgba(38,26,18,0.82); --card-bg2:rgba(48,34,26,0.72);
  --nav-bg:rgba(30,20,16,0.94); --bottom-bg:rgba(30,20,16,0.92);
  --ep-bg:#1e1410; --search-bg:rgba(38,26,18,0.78);
  --w1:rgba(240,130,60,0.22); --w2:rgba(220,100,50,0.18); --w3:rgba(180,100,40,0.16);
  --thumb-scale:1;
  --status-style:black-translucent;
}

/* 🌙 夜晚 (20–24)  静谧深夜 */
.theme-night{
  --bg:#111318; --bg2:#181c22; --bg3:#1e232c; --bg4:#252b36;
  --t1:#dce2ec; --t2:#7a84a0; --t3:#424d62; --t4:#2a3244;
  --accent:#7890c8; --accent2:#6a9ea8; --warm:#a87890; --sand:#9898c8; --sage:#6a9888; --lavender:#9080c8;
  --bd:rgba(120,140,200,0.09); --bd2:rgba(120,140,200,0.14); --bd3:rgba(120,140,200,0.20);
  --sh-sm:0 1px 4px rgba(0,0,0,0.35),0 2px 14px rgba(0,0,0,0.25);
  --sh-md:0 4px 24px rgba(0,0,0,0.45),0 1px 6px rgba(0,0,0,0.35);
  --card-bg:rgba(24,28,34,0.82); --card-bg2:rgba(30,35,44,0.72);
  --nav-bg:rgba(17,19,24,0.94); --bottom-bg:rgba(17,19,24,0.92);
  --ep-bg:#111318; --search-bg:rgba(24,28,34,0.78);
  --w1:rgba(80,100,180,0.14); --w2:rgba(100,80,160,0.11); --w3:rgba(60,80,140,0.10);
  --thumb-scale:1;
  --status-style:black-translucent;
}

html,body{
  height:100%;overflow:hidden;
  background:var(--bg);color:var(--t1);
  font-family:var(--sans);-webkit-font-smoothing:antialiased;
  transition:background 2s ease, color 2s ease;
}

/* ── Layout ── */
.app{position:relative;height:100dvh;overflow:hidden;display:flex;flex-direction:column;}
.content{position:relative;z-index:1;display:flex;flex-direction:column;height:100dvh;overflow:hidden;}
.view{display:none;flex-direction:column;height:100%;overflow:hidden;}
.view.active{display:flex;}

/* ── Time indicator pill ── */
.time-pill-wrap{
  display:flex;flex-direction:column;align-items:center;
  padding:0 20px 4px;flex-shrink:0;position:relative;
}
.time-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--card-bg);
  border:1px solid var(--bd2);border-radius:9999px;
  padding:5px 14px 5px 10px;
  font-family:var(--sans);font-size:11px;color:var(--t3);
  font-weight:300;letter-spacing:0.06em;
  box-shadow:var(--sh-sm);
  cursor:pointer;
  transition:all 300ms var(--ease);
  user-select:none;
}
.time-pill:active{opacity:0.75;transform:scale(0.97);}
.time-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;opacity:0.85;}
/* theme switcher row (manual override) */
.theme-switcher{
  position:absolute;top:calc(100% + 6px);left:50%;
  transform:translateX(-50%);
  display:none;gap:6px;
  background:var(--card-bg);
  border:1px solid var(--bd2);border-radius:16px;padding:8px 10px;
  box-shadow:var(--sh-md);z-index:20;
  white-space:nowrap;
}
.theme-switcher.open{display:flex;}
.ts-btn{
  width:30px;height:30px;border-radius:50%;border:2px solid transparent;
  cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;
  transition:all 150ms var(--ease-spring);background:none;
  line-height:1;
}
.ts-btn:active{transform:scale(0.88);}
.ts-btn.active{border-color:var(--accent);transform:scale(1.12);}

/* ── Ambient background ── */
.ambient{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.wave-layer{
  position:absolute;width:160%;left:-30%;border-radius:45%;
  animation:waveFloat 14s ease-in-out infinite;
  transition:background 2.5s ease;
}
.wl1{height:360px;top:-200px;background:radial-gradient(ellipse at 50% 50%, var(--w1) 0%, transparent 68%);animation-duration:16s;}
.wl2{height:280px;top:-150px;background:radial-gradient(ellipse at 40% 60%, var(--w2) 0%, transparent 68%);animation-duration:20s;animation-delay:-6s;}
.wl3{height:220px;bottom:-90px;left:-10%;background:radial-gradient(ellipse at 60% 40%, var(--w3) 0%, transparent 68%);animation-duration:24s;animation-delay:-10s;}
/* extra star layer for night/midnight */
.stars{
  position:absolute;inset:0;
  background:transparent;
  opacity:0;transition:opacity 2s ease;
  pointer-events:none;
}
.theme-midnight .stars,.theme-night .stars{opacity:1;}
@keyframes waveFloat{
  0%,100%{transform:translateY(0) rotate(0deg);}
  33%{transform:translateY(-20px) rotate(1.8deg);}
  66%{transform:translateY(-9px) rotate(-1.2deg);}
}

/* ── Top nav ── */
.topnav{
  display:flex;justify-content:space-between;align-items:center;
  padding:calc(var(--safe-top) + 16px) 22px 14px;
  flex-shrink:0;
}
.nav-title{
  font-family:var(--serif);font-size:17px;font-weight:400;
  letter-spacing:0.06em;color:var(--t1);
}
.nav-btn{
  background:var(--accent);color:white;border:none;cursor:pointer;
  padding:8px 18px;border-radius:9999px;
  font-family:var(--sans);font-size:13px;font-weight:400;
  letter-spacing:0.04em;
  transition:all 280ms var(--ease);
  box-shadow:0 2px 10px rgba(91,143,168,0.28);
}
.nav-btn:active{transform:scale(0.96);opacity:0.88;}

/* ── Date hero ── */
.date-hero{text-align:center;padding:6px 24px 16px;flex-shrink:0;}
.date-meta{
  font-family:var(--sans);font-weight:300;font-size:11px;
  letter-spacing:0.22em;color:var(--t3);text-transform:uppercase;margin-bottom:4px;
}
.date-num{
  font-family:var(--serif);font-weight:300;font-size:58px;
  letter-spacing:-0.02em;line-height:1;color:var(--t1);
  opacity:0.88;
}
.entry-badge{
  display:inline-flex;align-items:center;margin-top:8px;
  background:rgba(91,143,168,0.1);
  border:1px solid rgba(91,143,168,0.2);
  color:var(--accent);border-radius:9999px;
  font-family:var(--sans);font-size:11px;font-weight:400;
  letter-spacing:0.06em;padding:3px 12px;
}

/* ── Mood / Energy quick bar ── */
.mood-energy-row{display:flex;gap:10px;padding:0 20px 14px;flex-shrink:0;}
.me-card{
  flex:1;
  background:var(--card-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--bd2);
  border-radius:18px;
  padding:11px 13px;
  box-shadow:var(--sh-sm);
  transition:background 2s ease, border-color 2s ease;
}
.me-label{
  font-size:10px;font-weight:400;letter-spacing:0.1em;
  color:var(--t3);text-transform:uppercase;margin-bottom:7px;
}
.mood-row{display:flex;gap:3px;justify-content:space-between;}
.mood-opt{
  font-size:19px;cursor:pointer;opacity:0.3;
  transition:all 160ms var(--ease-spring);
  padding:2px;border-radius:8px;line-height:1;
}
.mood-opt.active{opacity:1;transform:scale(1.25);}
.energy-bar-wrap{display:flex;gap:3px;align-items:center;}
.energy-seg{
  flex:1;height:6px;border-radius:3px;
  background:var(--bg3);cursor:pointer;
  transition:all 160ms var(--ease);
}
.energy-seg.filled{background:var(--accent2);}
.energy-seg.filled.med{background:var(--sand);}
.energy-seg.filled.low{background:var(--warm);}
.energy-val{font-size:11px;color:var(--t3);min-width:20px;text-align:right;padding-left:4px;}

/* ── Search ── */
.search-wrap{padding:0 20px 12px;flex-shrink:0;}
.search-field{
  display:flex;align-items:center;gap:8px;
  background:var(--search-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--bd2);border-radius:16px;
  padding:11px 14px;box-shadow:var(--sh-sm);
  transition:all 280ms var(--ease);
}
.search-field:focus-within{
  border-color:rgba(91,143,168,0.4);
  box-shadow:0 0 0 3px rgba(91,143,168,0.1),var(--sh-sm);
}
.search-icon{color:var(--t3);flex-shrink:0;}
.search-input{
  background:none;border:none;outline:none;flex:1;
  font-family:var(--sans);font-size:15px;font-weight:300;color:var(--t1);
}
.search-input::placeholder{color:var(--t4);}

/* ── List scroll ── */
.list-scroll{flex:1;overflow-y:auto;padding:0 20px 8px;-webkit-overflow-scrolling:touch;}
.list-scroll::-webkit-scrollbar{display:none;}
.section-label{
  font-family:var(--sans);font-size:10px;font-weight:400;
  letter-spacing:0.1em;color:var(--t3);text-transform:uppercase;
  padding:4px 2px 8px;
}

/* ── Entry card ── */
.entry-card{
  background:var(--card-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--bd);
  border-radius:20px;padding:15px 17px;margin-bottom:9px;
  cursor:pointer;
  transition:background 2s ease, border-color 2s ease, transform 260ms var(--ease), opacity 260ms var(--ease);
  box-shadow:var(--sh-sm);
}
.entry-card:active{transform:scale(0.985);opacity:0.9;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.card-title{
  font-family:var(--serif);font-size:15px;font-weight:400;color:var(--t1);
  letter-spacing:0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
}
.card-date{
  font-family:var(--sans);font-size:10px;color:var(--t3);
  flex-shrink:0;margin-top:2px;font-weight:300;
}
.card-preview{
  font-family:var(--sans);font-size:13px;color:var(--t2);
  margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-weight:300;line-height:1.55;
}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;align-items:center;}
.tag-chip{
  font-family:var(--sans);font-size:11px;font-weight:400;
  padding:3px 9px;border-radius:9999px;letter-spacing:0.02em;
}

/* ── Archive ── */
.arc-card{
  background:var(--card-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--bd);border-radius:20px;
  padding:14px 16px;margin-bottom:9px;
  transition:background 2s ease, border-color 2s ease, transform 260ms var(--ease);
  box-shadow:var(--sh-sm);
  display:flex;align-items:flex-start;gap:12px;
}
.arc-card.selected{border-color:rgba(91,143,168,0.4);background:rgba(91,143,168,0.07);}
.cb-wrap{flex-shrink:0;margin-top:2px;cursor:pointer;}
.cb{
  width:22px;height:22px;border-radius:7px;
  border:1.5px solid var(--bd3);background:var(--card-bg2);
  display:flex;align-items:center;justify-content:center;
  transition:all 150ms var(--ease);
}
.cb.checked{background:var(--accent);border-color:var(--accent);box-shadow:0 2px 8px rgba(91,143,168,0.35);}
.cb svg{opacity:0;transition:opacity 150ms;}
.cb.checked svg{opacity:1;}
.arc-meta{flex:1;min-width:0;}
.arc-title{
  font-family:var(--serif);font-size:15px;font-weight:400;
  color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.arc-card.selected .arc-title{color:var(--t1);}
.arc-date{font-family:var(--sans);font-size:10px;color:var(--t3);margin-top:3px;font-weight:300;}
.arc-preview{
  font-family:var(--sans);font-size:13px;color:var(--t3);
  margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:300;
}
.arc-actionbar{flex-shrink:0;padding:8px 20px 10px;}
.arc-actionbar-inner{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--card-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--bd2);border-radius:16px;
  padding:10px 16px;box-shadow:var(--sh-sm);
}
.arc-count{font-family:var(--sans);font-size:12px;color:var(--t2);}
.arc-btns{display:flex;gap:7px;}
.arc-btn{
  border:1px solid var(--bd2);background:var(--card-bg2);
  color:var(--t1);padding:7px 14px;border-radius:9999px;
  font-family:var(--sans);font-size:12px;font-weight:400;
  cursor:pointer;transition:all 150ms var(--ease);box-shadow:var(--sh-sm);
}
.arc-btn:active{transform:scale(0.95);}
.arc-btn.restore{color:var(--accent2);border-color:rgba(123,168,154,0.35);}
.arc-btn.delete{color:var(--warm);border-color:rgba(201,137,106,0.35);}
.arc-btn:disabled{opacity:0.3;pointer-events:none;}
.arc-selall{
  font-family:var(--sans);font-size:12px;color:var(--accent);
  background:none;border:none;cursor:pointer;padding:2px 0;
}
.empty-state{
  text-align:center;padding:60px 20px;color:var(--t3);
  font-family:var(--serif);font-size:14px;font-weight:300;
  line-height:2.8;letter-spacing:0.06em;
}

/* ── Bottom nav ── */
.bottom-nav{
  display:flex;justify-content:space-around;align-items:center;
  padding:10px 0 calc(var(--safe-bottom) + 10px);
  background:var(--bottom-bg);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-top:1px solid var(--bd);
  flex-shrink:0;
  transition:background 2s ease, border-color 2s ease;
}
.tab-btn{
  background:none;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:4px 12px;transition:all 150ms var(--ease);
}
.tab-btn:active{transform:scale(0.88);}
.tab-icon{font-size:20px;opacity:0.3;transition:opacity 150ms;}
.tab-label{
  font-family:var(--sans);font-size:10px;font-weight:400;
  color:var(--t3);letter-spacing:0.06em;transition:color 150ms;
}
.tab-btn.active .tab-icon{opacity:1;}
.tab-btn.active .tab-label{color:var(--accent);}

/* ── Calendar ── */
.cal-topbar{padding:4px 20px 10px;flex-shrink:0;}
.cal-month-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-month-label{font-family:var(--serif);font-size:20px;font-weight:400;letter-spacing:0.04em;color:var(--t1);}
.cal-arrows{display:flex;gap:6px;}
.cal-arr{
  background:var(--card-bg);border:1px solid var(--bd2);
  color:var(--t2);width:32px;height:32px;border-radius:9999px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:all 150ms;box-shadow:var(--sh-sm);
}
.cal-arr:active{transform:scale(0.9);}
.cal-wdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px;}
.cal-wd{
  text-align:center;font-size:10px;color:var(--t3);
  letter-spacing:0.08em;padding:4px 0;font-family:var(--sans);
}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;border-radius:10px;cursor:pointer;position:relative;
  font-family:var(--sans);font-size:14px;font-weight:300;color:var(--t2);
  transition:all 150ms;
}
.cal-cell.empty{pointer-events:none;}
.cal-cell:active{transform:scale(0.88);}
.cal-cell.has-dot{color:var(--t1);font-weight:500;}
.cal-cell.has-dot::after{
  content:'';width:4px;height:4px;border-radius:50%;
  background:var(--accent);position:absolute;bottom:3px;
}
.cal-cell.today{
  background:var(--accent);color:white;font-weight:500;
  box-shadow:0 3px 12px rgba(91,143,168,0.35);
}
.cal-cell.today::after{background:rgba(255,255,255,0.5);}
.cal-cell.selected{
  background:rgba(91,143,168,0.12);border:1px solid rgba(91,143,168,0.25);color:var(--t1);
}
.cal-results{flex:1;overflow-y:auto;padding:12px 20px 8px;-webkit-overflow-scrolling:touch;}
.cal-results::-webkit-scrollbar{display:none;}
.cal-filter-label{
  font-family:var(--sans);font-size:10px;letter-spacing:0.1em;
  color:var(--t3);text-transform:uppercase;margin-bottom:10px;
}

/* ── Entry view ── */
.ep-wrap{background:var(--ep-bg);flex:1;display:flex;flex-direction:column;overflow:hidden;transition:background 2s ease;}
.ep-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-top) + 14px) 20px 12px;
  background:var(--nav-bg);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bd);flex-shrink:0;
  transition:background 2s ease, border-color 2s ease;
}
.ep-back{
  display:flex;align-items:center;gap:5px;background:none;border:none;
  cursor:pointer;color:var(--accent);font-family:var(--sans);
  font-size:14px;font-weight:300;padding:4px 0;
}
.ep-act{display:flex;gap:7px;}
.ep-btn{
  background:var(--card-bg);border:1px solid var(--bd2);color:var(--t1);
  padding:7px 14px;border-radius:9999px;
  font-family:var(--sans);font-size:13px;font-weight:300;
  cursor:pointer;transition:all 150ms;box-shadow:var(--sh-sm);
}
.ep-btn:active{transform:scale(0.96);}
.ep-btn.blue{
  background:var(--accent);border-color:transparent;color:white;
  box-shadow:0 3px 12px rgba(91,143,168,0.32);
}
.ep-btn.red{color:var(--warm);background:rgba(201,137,106,0.08);border-color:rgba(201,137,106,0.2);}
.ep-scroll{flex:1;overflow-y:auto;padding:24px 24px 36px;-webkit-overflow-scrolling:touch;}
.ep-scroll::-webkit-scrollbar{display:none;}
.ep-date-lbl{
  font-family:var(--sans);font-size:10px;font-weight:300;
  letter-spacing:0.16em;color:var(--t3);text-transform:uppercase;margin-bottom:12px;
}
.ep-title-in{
  width:100%;background:none;border:none;outline:none;
  font-family:var(--serif);font-size:24px;font-weight:400;
  color:var(--t1);letter-spacing:0.02em;margin-bottom:16px;
  caret-color:var(--accent);
}
.ep-title-in::placeholder{color:var(--t4);font-weight:300;}
.ep-tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
.ep-tag{
  background:var(--card-bg);border:1px solid var(--bd2);color:var(--t2);
  padding:6px 14px;border-radius:9999px;
  font-family:var(--sans);font-size:12px;font-weight:300;
  cursor:pointer;transition:all 150ms;
}
.ep-tag:active{transform:scale(0.95);}
.ep-tag.on-decision{background:rgba(212,169,106,0.15);border-color:rgba(212,169,106,0.4);color:var(--sand);}
.ep-tag.on-event{background:rgba(91,143,168,0.12);border-color:rgba(91,143,168,0.35);color:var(--accent);}
.ep-tag.on-insight{background:rgba(141,168,136,0.14);border-color:rgba(141,168,136,0.38);color:var(--sage);}
.ep-tag.on-retro{background:rgba(155,141,180,0.13);border-color:rgba(155,141,180,0.35);color:var(--lavender);}
.ep-divider{border:none;border-top:1px solid var(--bd);margin:0 0 18px;}

/* ── Mood in editor ── */
.ep-mood-row{
  display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;
  padding:10px 14px;background:var(--card-bg2);
  border:1px solid var(--bd);border-radius:14px;
}
.ep-mood-label{font-size:11px;color:var(--t3);letter-spacing:0.06em;font-weight:300;}
.ep-mood-opts{display:flex;gap:7px;}
.ep-mood-opt{
  font-size:18px;cursor:pointer;opacity:0.28;
  transition:all 160ms var(--ease-spring);padding:2px;border-radius:8px;line-height:1;
}
.ep-mood-opt.active{opacity:1;transform:scale(1.22);}
.ep-nrg-segs{display:flex;gap:3px;align-items:center;}
.ep-nrg-seg{
  width:22px;height:5px;border-radius:3px;background:var(--bg3);
  cursor:pointer;transition:all 120ms;
}
.ep-nrg-seg.on{background:var(--accent2);}
.ep-nrg-seg.on.med{background:var(--sand);}
.ep-nrg-seg.on.low{background:var(--warm);}

/* ── Rich text toolbar ── */
.rich-toolbar{
  display:flex;gap:4px;padding:0 0 12px;flex-wrap:wrap;
}
.rt-btn{
  background:var(--card-bg);border:1px solid var(--bd2);color:var(--t2);
  width:34px;height:30px;border-radius:9px;
  font-family:var(--serif);font-size:12px;font-weight:500;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 120ms;
}
.rt-btn:active{transform:scale(0.92);}
.rt-btn.active{
  background:rgba(91,143,168,0.14);border-color:rgba(91,143,168,0.38);color:var(--accent);
}
.rt-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.rt-div{width:1px;height:28px;background:var(--bd2);margin:0 2px;align-self:center;}

/* ── Editor content area ── */
.ep-editor{
  width:100%;min-height:260px;outline:none;
  font-family:var(--serif);font-size:16px;font-weight:300;
  color:var(--t1);line-height:2;letter-spacing:0.03em;
  caret-color:var(--accent);
}
.ep-editor:empty::before{content:attr(data-placeholder);color:var(--t4);}
.ep-editor h1{font-size:22px;font-weight:500;color:var(--t1);margin:10px 0 6px;line-height:1.4;}
.ep-editor h2{font-size:18px;font-weight:400;color:var(--t1);margin:8px 0 4px;}
.ep-editor h3{font-size:16px;font-weight:500;color:var(--t1);margin:6px 0 3px;}
.ep-editor strong{color:var(--t1);font-weight:500;}
.ep-editor em{color:var(--accent);font-style:italic;}
.ep-editor ul,.ep-editor ol{padding-left:20px;margin:4px 0;}
.ep-editor li{line-height:2;}
.ep-editor blockquote{
  border-left:2px solid var(--t4);padding-left:14px;
  color:var(--t2);margin:8px 0;font-style:italic;
}

/* ── Read mode ── */
.ep-read-title{
  font-family:var(--serif);font-size:24px;font-weight:400;
  color:var(--t1);letter-spacing:0.02em;margin-bottom:12px;line-height:1.4;
}
.ep-read-body{
  font-family:var(--serif);font-size:16px;font-weight:300;
  color:var(--t1);line-height:2;letter-spacing:0.03em;
}
.ep-read-body h1{font-size:22px;font-weight:500;color:var(--t1);margin:10px 0 6px;line-height:1.4;}
.ep-read-body h2{font-size:18px;font-weight:400;color:var(--t1);margin:8px 0 4px;}
.ep-read-body h3{font-size:16px;font-weight:500;color:var(--t1);margin:6px 0 3px;}
.ep-read-body strong{color:var(--t1);font-weight:500;}
.ep-read-body em{color:var(--accent);font-style:italic;}
.ep-read-body ul,.ep-read-body ol{padding-left:20px;margin:4px 0;}
.ep-read-body li{line-height:2;}
.ep-read-body blockquote{
  border-left:2px solid var(--t4);padding-left:14px;
  color:var(--t2);margin:8px 0;font-style:italic;
}

/* ── Stats ── */
.stats-scroll{flex:1;overflow-y:auto;padding:0 20px 20px;-webkit-overflow-scrolling:touch;}
.stats-scroll::-webkit-scrollbar{display:none;}
.stats-sec{margin-bottom:20px;}
.stats-sec-title{
  font-family:var(--sans);font-size:10px;font-weight:400;
  letter-spacing:0.12em;color:var(--t3);text-transform:uppercase;
  padding:0 2px;margin-bottom:10px;
}
.stat-card{
  background:var(--card-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--bd2);border-radius:20px;padding:16px;
  box-shadow:var(--sh-sm);margin-bottom:10px;
  transition:background 2s ease;
}
.streak-card{
  background:linear-gradient(135deg,rgba(var(--accent-rgb,91,143,168),0.13),rgba(var(--accent2-rgb,123,168,154),0.10));
  border:1px solid var(--bd2);border-radius:20px;padding:18px;
  display:flex;justify-content:space-between;align-items:center;
  transition:background 2s ease;
}
.streak-val{font-family:var(--serif);font-size:48px;font-weight:300;color:var(--t1);line-height:1;}
.streak-label{font-family:var(--sans);font-size:12px;color:var(--t2);margin-top:4px;font-weight:300;}
.stat-row2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px;}
.stat-kv{
  background:var(--card-bg2);border:1px solid var(--bd);
  border-radius:16px;padding:14px 16px;
  transition:background 2s ease;
}
.stat-val{font-family:var(--serif);font-size:28px;font-weight:300;color:var(--t1);line-height:1;}
.stat-key{font-family:var(--sans);font-size:11px;color:var(--t3);margin-top:5px;letter-spacing:0.04em;font-weight:300;}

/* mood chart */
.mood-chart{display:flex;justify-content:space-around;align-items:flex-end;gap:6px;height:80px;padding-top:8px;}
.mood-bar-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;}
.mood-bar-emoji{font-size:16px;}
.mood-bar-track{flex:1;width:100%;background:var(--bg3);border-radius:6px;overflow:hidden;display:flex;align-items:flex-end;min-height:6px;}
.mood-bar-fill{width:100%;border-radius:6px;background:var(--accent);transition:height 600ms cubic-bezier(0.34,1.56,0.64,1);}
.mood-bar-cnt{font-size:10px;color:var(--t3);}

/* tag bars */
.tag-bar-list{display:flex;flex-direction:column;gap:9px;}
.tag-bar-row{display:flex;align-items:center;gap:10px;}
.tag-bar-label{font-size:12px;color:var(--t2);width:76px;flex-shrink:0;font-weight:300;}
.tag-bar-track{flex:1;height:7px;background:var(--bg3);border-radius:4px;overflow:hidden;}
.tag-bar-fill{height:100%;border-radius:4px;transition:width 600ms cubic-bezier(0.34,1.56,0.64,1);}
.tag-bar-cnt{font-size:11px;color:var(--t3);width:22px;text-align:right;flex-shrink:0;}

/* heatmap */
.heatmap-outer{overflow-x:auto;}
.heatmap-grid{display:inline-grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;}
.hm-cell{width:12px;height:12px;border-radius:3px;background:var(--bg3);}
.hm-cell.l1{background:rgba(91,143,168,0.25);}
.hm-cell.l2{background:rgba(91,143,168,0.48);}
.hm-cell.l3{background:rgba(91,143,168,0.70);}
.hm-cell.l4{background:rgba(91,143,168,0.92);}

/* reminder */
.rem-card{
  background:var(--card-bg2);border:1px solid var(--bd2);
  border-radius:20px;padding:16px;margin-bottom:8px;
  transition:background 2s ease;
}
.rem-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.rem-title{font-size:14px;color:var(--t1);font-weight:300;}
.toggle{position:relative;width:44px;height:26px;cursor:pointer;flex-shrink:0;}
.toggle-track{
  width:44px;height:26px;border-radius:13px;
  background:var(--bg3);transition:background 200ms;border:1px solid var(--bd2);
}
.toggle.on .toggle-track{background:var(--accent2);border-color:transparent;}
.toggle-thumb{
  position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:white;box-shadow:0 1px 4px rgba(0,0,0,0.18);transition:left 200ms var(--ease);
}
.toggle.on .toggle-thumb{left:21px;}
.rem-time-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.rem-time-label{font-size:12px;color:var(--t3);font-weight:300;}
.rem-time-input{
  background:var(--card-bg);border:1px solid var(--bd2);
  border-radius:10px;padding:6px 12px;
  font-family:var(--sans);font-size:14px;color:var(--t1);outline:none;
  transition:background 2s ease;
}
.rem-time-input::-webkit-calendar-picker-indicator{filter:opacity(0.4);}
.rem-days{display:flex;gap:5px;flex-wrap:wrap;}
.rd-btn{
  background:var(--bg2);border:1px solid var(--bd);
  border-radius:9999px;color:var(--t3);
  padding:5px 10px;font-family:var(--sans);font-size:11px;
  cursor:pointer;transition:all 120ms;font-weight:300;
}.rd-btn.on{
  background:rgba(91,143,168,0.14);
  border-color:rgba(91,143,168,0.35);color:var(--accent);
}

/* ── Toast ── */
.toast{
  position:absolute;bottom:84px;left:50%;
  transform:translateX(-50%) translateY(8px) scale(0.95);
  background:var(--card-bg);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--bd2);color:var(--t1);
  padding:10px 20px;border-radius:9999px;
  font-family:var(--sans);font-size:13px;font-weight:300;
  pointer-events:none;opacity:0;
  transition:opacity 0.3s var(--ease-out), transform 0.3s var(--ease-out);
  white-space:nowrap;z-index:99;
  box-shadow:var(--sh-md);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}

/* ── Auth overlay ── */
.auth-overlay{
  position:fixed;inset:0;z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 28px calc(var(--safe-bottom)+32px);
  background:var(--bg);
  transition:background 2s ease;
}
.auth-logo{
  font-family:var(--serif);font-size:32px;font-weight:300;
  color:var(--t1);letter-spacing:0.06em;margin-bottom:6px;
}
.auth-sub{
  font-family:var(--sans);font-size:13px;font-weight:300;
  color:var(--t3);letter-spacing:0.1em;margin-bottom:48px;
}
.auth-card{
  width:100%;max-width:340px;
  background:var(--card-bg);
  border:1px solid var(--bd2);border-radius:24px;
  padding:28px 24px;box-shadow:var(--sh-md);
}
.auth-tab-row{display:flex;gap:0;margin-bottom:24px;background:var(--bg2);border-radius:12px;padding:3px;}
.auth-tab{
  flex:1;text-align:center;padding:8px 0;border-radius:10px;
  font-family:var(--sans);font-size:13px;font-weight:400;
  color:var(--t3);cursor:pointer;border:none;background:none;
  transition:all 200ms var(--ease);
}
.auth-tab.active{
  background:var(--card-bg);color:var(--t1);
  box-shadow:var(--sh-sm);
}
.auth-field{
  display:flex;flex-direction:column;gap:6px;margin-bottom:14px;
}
.auth-field label{
  font-family:var(--sans);font-size:11px;font-weight:400;
  color:var(--t3);letter-spacing:0.08em;
}
.auth-input{
  width:100%;background:var(--bg2);border:1px solid var(--bd2);
  border-radius:12px;padding:12px 14px;
  font-family:var(--sans);font-size:15px;font-weight:300;
  color:var(--t1);outline:none;
  transition:border-color 200ms;
}
.auth-input:focus{border-color:var(--accent);}
.auth-input::placeholder{color:var(--t4);}
.auth-submit{
  width:100%;margin-top:8px;padding:14px;border-radius:14px;border:none;
  background:var(--accent);color:white;
  font-family:var(--sans);font-size:15px;font-weight:400;
  cursor:pointer;transition:all 200ms var(--ease);
  box-shadow:0 3px 12px rgba(91,143,168,0.32);
}
.auth-submit:active{transform:scale(0.97);opacity:0.88;}
.auth-submit:disabled{opacity:0.5;pointer-events:none;}
.auth-err{
  font-family:var(--sans);font-size:12px;color:var(--warm);
  text-align:center;margin-top:10px;min-height:18px;font-weight:300;
}
.auth-loading{
  display:flex;flex-direction:column;align-items:center;gap:16px;
}
.auth-spinner{
  width:36px;height:36px;border-radius:50%;
  border:2px solid var(--bd2);border-top-color:var(--accent);
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
/* sync status badge */
.sync-badge{
  display:flex;align-items:center;gap:5px;
  font-family:var(--sans);font-size:10px;font-weight:300;
  color:var(--t3);letter-spacing:0.06em;
  padding:3px 10px;border-radius:9999px;
  border:1px solid var(--bd);background:var(--card-bg2);
  cursor:pointer;transition:all 200ms;
}
.sync-badge:active{opacity:0.7;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--t4);flex-shrink:0;}
.sync-dot.synced{background:var(--accent2);}
.sync-dot.syncing{background:var(--sand);animation:pulse 1s ease-in-out infinite;}
.sync-dot.error{background:var(--warm);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
</style>
</head>
<body>
<div class="app">
  <!-- Auth overlay -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-loading" id="authLoading">
      <div class="auth-spinner"></div>
      <div style="font-family:var(--sans);font-size:13px;color:var(--t3);font-weight:300;">正在连接…</div>
    </div>
    <div id="authForm" style="display:none;width:100%;max-width:340px;display:none;flex-direction:column;align-items:center;">
      <div class="auth-logo">PM 日记</div>
      <div class="auth-sub">记录每一个思考瞬间</div>
      <div class="auth-card">
        <div class="auth-tab-row">
          <button class="auth-tab active" id="tabLogin" onclick="showAuthTab('login')">登录</button>
          <button class="auth-tab" id="tabSignup" onclick="showAuthTab('signup')">注册</button>
        </div>
        <div class="auth-field">
          <label>邮箱</label>
          <input class="auth-input" id="authEmail" type="email" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="auth-field">
          <label>密码</label>
          <input class="auth-input" id="authPassword" type="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="auth-submit" id="authSubmit" onclick="doAuth()">登录</button>
        <div class="auth-err" id="authErr"></div>
      </div>
    </div>
  </div>

  <div class="ambient">
    <div class="wave-layer wl1"></div>
    <div class="wave-layer wl2"></div>
    <div class="wave-layer wl3"></div>
    <canvas class="stars" id="starsCanvas"></canvas>
  </div>

  <div class="content">

    <!-- LIST -->
    <div class="view active" id="viewList">

<script>
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   时间主题引擎
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const THEMES={
  midnight:{name:'凌晨',emoji:'🌃',hours:[0,5],label:'深夜 · 寂静时刻'},
  dawn:    {name:'清晨',emoji:'🌄',hours:[5,8], label:'清晨 · 第一缕光'},
  morning: {name:'上午',emoji:'☀️',hours:[8,12],label:'上午 · 精力充沛'},
  afternoon:{name:'下午',emoji:'🌿',hours:[12,17],label:'下午 · 专注时光'},
  dusk:    {name:'黄昏',emoji:'🌇',hours:[17,20],label:'黄昏 · 一日将暮'},
  night:   {name:'夜晚',emoji:'🌙',hours:[20,24],label:'夜晚 · 安静回想'},
};
let manualTheme=null;

function getAutoTheme(){
  const h=new Date().getHours();
  for(const[k,v]of Object.entries(THEMES)){if(h>=v.hours[0]&&h<v.hours[1])return k;}
  return'night';
}
function getCurrentTheme(){return manualTheme||getAutoTheme();}

function applyTheme(key){
  const app=document.querySelector('.app');
  Object.keys(THEMES).forEach(k=>app.classList.remove('theme-'+k));
  app.classList.add('theme-'+key);
  // update pill
  const t=THEMES[key];
  document.getElementById('timePillLabel').textContent=`${t.emoji} ${t.label}`;
  // update switcher buttons
  document.querySelectorAll('.ts-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.theme===key);
  });
  // stars
  if(key==='midnight'||key==='night')drawStars();
}

function setManualTheme(key){
  manualTheme=key;
  applyTheme(key);
  document.getElementById('themeSwitcher').classList.remove('open');
  showToast(`已切换到 ${THEMES[key].emoji} ${THEMES[key].name}`);
}

function toggleThemeSwitcher(){
  const el=document.getElementById('themeSwitcher');
  el.classList.toggle('open');
}

// Auto-update every minute
function tickTheme(){
  if(!manualTheme){applyTheme(getAutoTheme());}
}
setInterval(tickTheme,60000);

/* Stars canvas for midnight/night */
function drawStars(){
  const c=document.getElementById('starsCanvas');
  if(!c)return;
  c.width=window.innerWidth;c.height=window.innerHeight;
  const ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  for(let i=0;i<120;i++){
    const x=Math.random()*c.width;
    const y=Math.random()*c.height*0.65;
    const r=Math.random()*1.2+0.2;
    const a=Math.random()*0.6+0.2;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=`rgba(200,220,255,${a})`;ctx.fill();
  }
}

const STORE='pm-tidal-v1',STORE_ARC='pm-tidal-arc-v1',STORE_META='pm-tidal-meta-v1',STORE_REM='pm-tidal-rem-v1';
let entries=[],archive=[],meta={},selected=new Set();
let currentId=null,prevTab='list',calYear,calMonth,calSelected=null;

const TAGS={
  decision:{label:'📌 决策',cls:'on-decision',hex:'#d4a96a'},
  event:   {label:'📅 事件',cls:'on-event',   hex:'#5b8fa8'},
  insight: {label:'💡 心得',cls:'on-insight',  hex:'#8da888'},
  retro:   {label:'🔍 复盘',cls:'on-retro',    hex:'#9b8db4'}
};
const MOODS=['😞','😕','😐','🙂','😄'];
let remSettings={enabled:false,time:'21:00',days:[1,2,3,4,5]};

function load(){
  try{const s=localStorage.getItem(STORE);if(s)entries=JSON.parse(s);}catch(e){}
  try{const s=localStorage.getItem(STORE_ARC);if(s)archive=JSON.parse(s);}catch(e){}
  try{const s=localStorage.getItem(STORE_META);if(s)meta=JSON.parse(s);}catch(e){}
  try{const s=localStorage.getItem(STORE_REM);if(s)remSettings=JSON.parse(s);}catch(e){}
}
function todayStr(){return new Date().toISOString().split('T')[0];}
function esc(s=''){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function getBodyText(html){const d=document.createElement('div');d.innerHTML=html;return d.textContent||d.innerText||'';}

/* Date hero */
function renderDate(){
  const d=new Date();
  const mo=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const da=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  document.getElementById('dateMeta').textContent=`${d.getFullYear()}  ·  ${mo[d.getMonth()]}  ·  ${da[d.getDay()]}`;
  document.getElementById('dateNum').textContent=String(d.getDate()).padStart(2,'0');
  const b=document.getElementById('entryBadge');
  b.innerHTML=entries.length?`<span class="entry-badge">${entries.length} 篇记录</span>`:'';
}

/* Quick mood/energy */
function renderQuickMoodEnergy(){
  const m=meta[todayStr()]||{};
  document.getElementById('quickMoodRow').innerHTML=MOODS.map((em,i)=>
    `<span class="mood-opt${m.mood===i?' active':''}" onclick="setTodayMood(${i})">${em}</span>`).join('');
  const e=m.energy||0;
  let segs='';
  for(let i=1;i<=5;i++){
    const c='energy-seg'+(i<=e?' filled':'')+(i<=e&&e<=2?' low':i<=e&&e<=3?' med':'');
    segs+=`<div class="${c}" onclick="setTodayEnergy(${i})"></div>`;
  }
  document.getElementById('quickEnergyRow').innerHTML=segs+`<span class="energy-val">${e||'–'}</span>`;
}
function setTodayMood(i){if(!meta[todayStr()])meta[todayStr()]={};meta[todayStr()].mood=i;persist();renderQuickMoodEnergy();showToast(`${MOODS[i]} 心情已记录`);}
function setTodayEnergy(v){if(!meta[todayStr()])meta[todayStr()]={};meta[todayStr()].energy=v;persist();renderQuickMoodEnergy();showToast(`能量 ${v}/5 已记录`);}

/* List */
function renderFiltered(){
  const q=(document.getElementById('searchInput')?.value||'').trim().toLowerCase();
  const list=q?entries.filter(e=>(e.title||'').toLowerCase().includes(q)||getBodyText(e.body||'').toLowerCase().includes(q)):entries;
  renderCards([...list].sort((a,b)=>b.date.localeCompare(a.date)),'listScroll',q?`找到 ${list.length} 篇`:'');
}
function renderCards(sorted,cid,label){
  const el=document.getElementById(cid);if(!el)return;
  if(!sorted.length){el.innerHTML=`<div class="empty-state">此刻宁静<br>写下今天的故事</div>`;return;}
  el.innerHTML=(label?`<div class="section-label">${label}</div>`:'')+sorted.map(e=>{
    const pills=(e.tags||[]).map(t=>`<span class="tag-chip" style="background:${TAGS[t]?.hex}18;color:${TAGS[t]?.hex};border:1px solid ${TAGS[t]?.hex}30;">${TAGS[t]?.label}</span>`).join('');
    const preview=getBodyText(e.body||'').slice(0,30)||'';
    const em=meta[e.date];
    const moodBadge=em&&em.mood!=null?`<span style="font-size:14px;margin-left:6px;">${MOODS[em.mood]}</span>`:'';
    return`<div class="entry-card" onclick="openEntry('${e.id}')"><div class="card-top"><div class="card-title">${esc(e.title)||'无标题'}</div><div style="display:flex;align-items:center;">${moodBadge}<div class="card-date" style="margin-left:${moodBadge?4:0}px;">${e.date}</div></div></div>${preview?`<div class="card-preview">${esc(preview)}…</div>`:''}${pills?`<div class="card-tags">${pills}</div>`:''}</div>`;
  }).join('');
}

/* Archive */
function renderArchive(){
  const el=document.getElementById('archiveScroll');
  if(!archive.length){el.innerHTML=`<div class="empty-state">归档为空<br>删除的日记会出现在这里</div>`;updateArcBar();return;}
  el.innerHTML=[...archive].sort((a,b)=>b.archivedAt.localeCompare(a.archivedAt)).map(e=>{
    const isSel=selected.has(e.id);
    const pills=(e.tags||[]).map(t=>`<span class="tag-chip" style="font-size:10px;padding:2px 7px;background:${TAGS[t]?.hex}18;color:${TAGS[t]?.hex};border:1px solid ${TAGS[t]?.hex}30;">${TAGS[t]?.label}</span>`).join('');
    const preview=getBodyText(e.body||'').slice(0,32);
    return`<div class="arc-card ${isSel?'selected':''}" onclick="toggleSelect('${e.id}')"><div class="cb-wrap" onclick="event.stopPropagation();toggleSelect('${e.id}')"><div class="cb ${isSel?'checked':''}" id="cb-${e.id}"><svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4.5L4 7.5L10 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div><div class="arc-meta"><div class="arc-title">${esc(e.title)||'无标题'}</div><div class="arc-date">${e.date}  ·  归档于 ${e.archivedAt}</div>${preview?`<div class="arc-preview">${esc(preview)}…</div>`:''}${pills?`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;">${pills}</div>`:''}</div></div>`;
  }).join('');
  updateArcBar();
}
function toggleSelect(id){selected.has(id)?selected.delete(id):selected.add(id);renderArchive();}
function toggleSelectAll(){selected.size===archive.length?selected.clear():archive.forEach(e=>selected.add(e.id));renderArchive();}
function updateArcBar(){
  const n=selected.size;
  document.getElementById('restoreBtn').disabled=n===0;document.getElementById('deleteBtn').disabled=n===0;
  document.getElementById('selAllBtn').textContent=archive.length>0&&selected.size===archive.length?'取消全选':'全选';
  document.getElementById('arcCount').innerHTML=`已选 <span style="color:var(--accent);font-weight:500;">${n}</span>  ·  共 ${archive.length} 篇`;
}
function restoreSelected(){
  const r=archive.filter(e=>selected.has(e.id));
  r.forEach(e=>{const{archivedAt,...rest}=e;entries.unshift(rest);});
  archive=archive.filter(e=>!selected.has(e.id));selected.clear();persist();renderDate();renderFiltered();renderArchive();showToast(`已恢复 ${r.length} 篇`);
}
function deleteSelected(){
  const n=selected.size;if(!confirm(`永久删除 ${n} 篇？`))return;
  archive=archive.filter(e=>!selected.has(e.id));selected.clear();persist();renderArchive();showToast(`已永久删除 ${n} 篇`);
}

/* Calendar */
function initCal(){const n=new Date();calYear=n.getFullYear();calMonth=n.getMonth();renderCal();}
function calShift(d){calMonth+=d;if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;}calSelected=null;renderCal();}
function renderCal(){
  const mo=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  document.getElementById('calMonthLabel').textContent=`${calYear}  ·  ${mo[calMonth]}`;
  document.getElementById('calWdays').innerHTML=['日','一','二','三','四','五','六'].map(w=>`<div class="cal-wd">${w}</div>`).join('');
  const first=new Date(calYear,calMonth,1).getDay(),total=new Date(calYear,calMonth+1,0).getDate(),today=todayStr();
  const ds=new Set(entries.map(e=>e.date));
  let h='<div class="cal-cell empty"></div>'.repeat(first);
  for(let d=1;d<=total;d++){
    const s=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const c=['cal-cell',ds.has(s)?'has-dot':'',s===today?'today':'',s===calSelected?'selected':''].filter(Boolean).join(' ');
    h+=`<div class="${c}" onclick="selectDay('${s}')">${d}</div>`;
  }
  document.getElementById('calGrid').innerHTML=h;renderCalResults();
}
function selectDay(ds){calSelected=calSelected===ds?null:ds;renderCal();}
function renderCalResults(){
  const el=document.getElementById('calResults');
  if(calSelected){
    const list=entries.filter(e=>e.date===calSelected).sort((a,b)=>b.id.localeCompare(a.id));
    el.innerHTML=`<div class="cal-filter-label">${calSelected}  ·  ${list.length?list.length+' 篇':'暂无记录'}</div>`;
    if(list.length)renderCards(list,'calResults','');
  }else{
    const m=`${calYear}-${String(calMonth+1).padStart(2,'0')}`;
    const list=entries.filter(e=>e.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date));
    el.innerHTML=`<div class="cal-filter-label">本月  ·  ${list.length?list.length+' 篇':'暂无记录'}</div>`;
    if(list.length)renderCards(list,'calResults','');
  }
}

/* Stats */
function renderStats(){
  const el=document.getElementById('statsScroll');if(!el)return;
  let streak=0,d=new Date();
  const dset=new Set(entries.map(e=>e.date));
  for(let i=0;i<366;i++){const s=d.toISOString().split('T')[0];if(dset.has(s)){streak++;d.setDate(d.getDate()-1);}else break;}
  const tc={};Object.keys(TAGS).forEach(t=>tc[t]=0);
  entries.forEach(e=>(e.tags||[]).forEach(t=>{if(tc[t]!=null)tc[t]++;}));
  const maxT=Math.max(...Object.values(tc),1);
  const mc=[0,0,0,0,0];
  Object.values(meta).forEach(m=>{if(m.mood!=null&&m.mood>=0&&m.mood<5)mc[m.mood]++;});
  const maxM=Math.max(...mc,1);
  const evs=Object.values(meta).filter(m=>m.energy).map(m=>m.energy);
  const avgE=evs.length?(evs.reduce((a,b)=>a+b,0)/evs.length).toFixed(1):'–';
  const totalW=entries.reduce((acc,e)=>{const t=getBodyText(e.body||'');return acc+(t.length?Math.ceil(t.length/1.8):0);},0);
  const hdays=[];const hd=new Date();hd.setDate(hd.getDate()-hd.getDay());hd.setDate(hd.getDate()-13*7);
  for(let i=0;i<14*7;i++){
    const s=hd.toISOString().split('T')[0];
    const cnt=entries.filter(e=>e.date===s).length;
    hdays.push({s,lvl:cnt===0?'':cnt===1?'l1':cnt===2?'l2':cnt===3?'l3':'l4'});
    hd.setDate(hd.getDate()+1);
  }
  el.innerHTML=`
  <div class="stats-sec">
    <div class="stats-sec-title">总览</div>
    <div class="streak-card">
      <div><div class="streak-val">${streak}</div><div class="streak-label">连续打卡天数 🔥</div></div>
      <div style="text-align:right;"><div style="font-family:var(--serif);font-size:38px;font-weight:300;color:var(--t1);line-height:1;">${entries.length}</div><div class="streak-label">篇日记</div></div>
    </div>
    <div class="stat-row2">
      <div class="stat-kv"><div class="stat-val">${totalW.toLocaleString()}</div><div class="stat-key">累计字数</div></div>
      <div class="stat-kv"><div class="stat-val">${avgE}</div><div class="stat-key">平均能量 ⚡</div></div>
    </div>
  </div>
  <div class="stats-sec">
    <div class="stats-sec-title">心情分布</div>
    <div class="stat-card">

function toggleReminder(){

  }
  saveRem();renderStats();showToast(remSettings.enabled?'提醒已开启 🔔':'提醒已关闭');
}
function setRemTime(v){remSettings.time=v;saveRem();}
function toggleRemDay(i){
  const idx=remSettings.days.indexOf(i);idx>-1?remSettings.days.splice(idx,1):remSettings.days.push(i);
  saveRem();
  const el=document.getElementById('remDays');
  if(el)el.innerHTML=['日','一','二','三','四','五','六'].map((d,j)=>`<button class="rd-btn ${remSettings.days.includes(j)?'on':''}" onclick="toggleRemDay(${j})">${d}</button>`).join('');
}
function saveRem(){localStorage.setItem(STORE_REM,JSON.stringify(remSettings));}
function checkReminder(){
  if(!remSettings.enabled||!('Notification'in window)||Notification.permission!=='granted')return;
  const now=new Date();const[h,m]=remSettings.time.split(':').map(Number);
  if(!remSettings.days.includes(now.getDay()))return;
  const key='pm-reminded-'+todayStr();if(localStorage.getItem(key))return;
  if(now.getHours()===h&&now.getMinutes()===m){
    localStorage.setItem(key,'1');
    new Notification('PM 日记',{body:'今天还没写日记，记录一下今天的思考吧 ✨'});
  }
}

/* Routing */
function switchTab(tab){
  const tabs=['list','cal','stats','archive'];
  tabs.forEach(x=>document.getElementById('view'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active',x===tab));
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',tabs[i%4]===tab));
  prevTab=tab;
  if(tab==='cal')renderCal();
  if(tab==='archive'){selected.clear();renderArchive();}
  if(tab==='stats')renderStats();
}
function goBack(){
  const v=prevTab==='cal'?'cal':prevTab==='archive'?'archive':prevTab==='stats'?'stats':'list';
  switchView(v);currentId=null;
}
function switchView(v){
  ['list','cal','stats','archive','entry'].forEach(x=>document.getElementById('view'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active',x===v));
}
function openNew(){
  const id=Date.now().toString();const e={id,date:todayStr(),title:'',body:'',tags:[]};
  entries.unshift(e);currentId=id;persist();showEditor(e);switchView('entry');
}
function openEntry(id){currentId=id;const e=entries.find(x=>x.id===id);if(e){showReader(e);switchView('entry');}}

/* Reader */

  const pills=(e.tags||[]).map(t=>`<span style="font-size:11px;padding:4px 11px;border-radius:999px;background:${TAGS[t]?.hex}18;color:${TAGS[t]?.hex};border:1px solid ${TAGS[t]?.hex}30;">${TAGS[t]?.label}</span>`).join('');

function buildNrgSegs(v){
  let s='';
  for(let i=1;i<=5;i++){
    const cls='ep-nrg-seg'+(i<=v?' on':'')+(i<=v&&v<=2?' low':i<=v&&v<=3?' med':'');
    s+=`<div class="${cls}" onclick="setEditorEnergy(${i})"></div>`;
  }
  return s;
}
function setEditorMood(i,btn){
  if(!meta[todayStr()])meta[todayStr()]={};meta[todayStr()].mood=i;persist();
  document.querySelectorAll('.ep-mood-opt').forEach((b,j)=>b.classList.toggle('active',j===i));

function setEditorEnergy(v){
  if(!meta[todayStr()])meta[todayStr()]={};meta[todayStr()].energy=v;persist();
  const el=document.getElementById('edNrg');if(el)el.innerHTML=buildNrgSegs(v);

function rtCmd(cmd){document.execCommand(cmd,false,null);document.getElementById('eBody')?.focus();updateTbState();}
function rtBlock(tag){document.execCommand('formatBlock',false,tag);document.getElementById('eBody')?.focus();}
function edKD(e){
  if(e.key==='Tab'){e.preventDefault();document.execCommand('insertHTML',false,'&nbsp;&nbsp;&nbsp;&nbsp;');}
  if((e.metaKey||e.ctrlKey)&&e.key==='b'){e.preventDefault();rtCmd('bold');}
  if((e.metaKey||e.ctrlKey)&&e.key==='i'){e.preventDefault();rtCmd('italic');}
}
function updateTbState(){
  const bold=document.getElementById('rtBold'),italic=document.getElementById('rtItalic');
  if(bold)bold.classList.toggle('active',document.queryCommandState('bold'));

}
function toggleTag(t,btn){
  const e=entries.find(x=>x.id===currentId);if(!e)return;
  if(!e.tags)e.tags=[];
  const i=e.tags.indexOf(t);
  i>-1?(e.tags.splice(i,1),btn.className='ep-tag'):(e.tags.push(t),btn.className='ep-tag '+TAGS[t].cls);
}
function doSave(){
  const e=entries.find(x=>x.id===currentId);if(!e)return;
  e.title=document.getElementById('eTitle')?.value||'';
  e.body=document.getElementById('eBody')?.innerHTML||'';
  persist();renderDate();renderFiltered();renderQuickMoodEnergy();showToast('已保存 ✓');showReader(e);

function moveToArchive(id){
  const e=entries.find(x=>x.id===id);if(!e)return;
  archive.unshift({...e,archivedAt:todayStr()});entries=entries.filter(x=>x.id!==id);
  persist();renderDate();renderFiltered();showToast('已移至归档');goBack();
}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   Supabase 云同步引擎
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const SB_URL='https://wrzvxbaccmrcdtjoyyjq.supabase.co';
const SB_KEY='sb_publishable_Ghn8-4zDFzz7K6H89Siukg_aIbRzHwY';
const sb=supabase.createClient(SB_URL,SB_KEY);
let currentUser=null;
let syncTimer=null;
let pendingSync=false;

/* ── Auth UI ── */
function showAuthTab(tab){
  document.getElementById('tabLogin').classList.toggle('active',tab==='login');
  document.getElementById('tabSignup').classList.toggle('active',tab==='signup');
  document.getElementById('authSubmit').textContent=tab==='login'?'登录':'注册';
  document.getElementById('authPassword').autocomplete=tab==='login'?'current-password':'new-password';
  document.getElementById('authErr').textContent='';
  document.getElementById('authSubmit').dataset.mode=tab;
}

async function doAuth(){
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  const mode=document.getElementById('authSubmit').dataset.mode||'login';
  const btn=document.getElementById('authSubmit');
  const errEl=document.getElementById('authErr');
  if(!email||!password){errEl.textContent='请填写邮箱和密码';return;}
  btn.disabled=true;btn.textContent='请稍候…';errEl.textContent='';
  try{
    let res;
    if(mode==='login'){
      res=await sb.auth.signInWithPassword({email,password});
    }else{
      res=await sb.auth.signUp({email,password});
    }
    if(res.error){errEl.textContent=translateAuthError(res.error.message);}
    else if(mode==='signup'&&!res.data.session){
      errEl.textContent='';
      btn.textContent='已发送验证邮件，请查收 ✉️';
    }
  }catch(e){errEl.textContent='网络错误，请检查连接';}
  finally{btn.disabled=false;if(btn.textContent==='请稍候…')btn.textContent=mode==='login'?'登录':'注册';}
}

function translateAuthError(msg){
  if(msg.includes('Invalid login'))return '邮箱或密码错误';
  if(msg.includes('Email not confirmed'))return '请先验证邮箱';
  if(msg.includes('already registered'))return '该邮箱已注册，请直接登录';
  if(msg.includes('Password should'))return '密码至少6位';
  return msg;
}

// Enter key submits
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.getElementById('authOverlay').style.display!=='none'){doAuth();}
});

async function signOut(){
  if(!confirm('确认退出登录？'))return;
  await sb.auth.signOut();

}

function hideAuthOverlay(){

}

/* ── Sync status UI ── */
function setSyncStatus(status,label){
  const dot=document.getElementById('syncDot');
  const lbl=document.getElementById('syncLabel');
  if(!dot||!lbl)return;
  dot.className='sync-dot'+(status?' '+status:'');
  lbl.textContent=label;
}

/* ── Pull from cloud ── */
async function pullFromCloud(){
  if(!currentUser)return;
  setSyncStatus('syncing','同步中…');
  try{
    // entries (active)
    const{data:eData,error:eErr}=await sb.from('entries')
      .select('*').eq('user_id',currentUser.id).eq('archived',false)
      .order('updated_at',{ascending:false});
    if(eErr)throw eErr;

    // archived
    const{data:aData,error:aErr}=await sb.from('entries')
      .select('*').eq('user_id',currentUser.id).eq('archived',true)
      .order('updated_at',{ascending:false});
    if(aErr)throw aErr;

    // meta
    const{data:mData,error:mErr}=await sb.from('daily_meta')
      .select('*').eq('user_id',currentUser.id);
    if(mErr)throw mErr;

    entries=(eData||[]).map(r=>({id:r.id,date:r.date,title:r.title,body:r.body,tags:r.tags||[]}));
    archive=(aData||[]).map(r=>({id:r.id,date:r.date,title:r.title,body:r.body,tags:r.tags||[],archivedAt:r.archived_at||r.date}));
    meta={};(mData||[]).forEach(r=>{meta[r.date]={mood:r.mood,energy:r.energy};});

    persistLocal();
    renderDate();renderFiltered();renderQuickMoodEnergy();
    setSyncStatus('synced','已同步');
    setTimeout(()=>setSyncStatus('synced','云端'),3000);
  }catch(e){
    console.error('pull error',e);
    setSyncStatus('error','同步失败');
  }
}

/* ── Push to cloud ── */
async function pushToCloud(){
  if(!currentUser)return;
  setSyncStatus('syncing','同步中…');
  try{
    const uid=currentUser.id;
    // upsert active entries
    if(entries.length){
      const rows=entries.map(e=>({id:e.id,user_id:uid,date:e.date,title:e.title,body:e.body,tags:e.tags||[],archived:false,archived_at:null,updated_at:new Date().toISOString()}));
      const{error}=await sb.from('entries').upsert(rows,{onConflict:'id,user_id'});
      if(error)throw error;
    }
    // upsert archived entries
    if(archive.length){
      const rows=archive.map(e=>({id:e.id,user_id:uid,date:e.date,title:e.title,body:e.body,tags:e.tags||[],archived:true,archived_at:e.archivedAt||e.date,updated_at:new Date().toISOString()}));
      const{error}=await sb.from('entries').upsert(rows,{onConflict:'id,user_id'});
      if(error)throw error;
    }
    // upsert meta
    const metaRows=Object.entries(meta).map(([date,v])=>({date,user_id:uid,mood:v.mood??null,energy:v.energy??null,updated_at:new Date().toISOString()}));
    if(metaRows.length){
      const{error}=await sb.from('daily_meta').upsert(metaRows,{onConflict:'date,user_id'});
      if(error)throw error;
    }
    setSyncStatus('synced','已同步');
    setTimeout(()=>setSyncStatus('synced','云端'),3000);
    pendingSync=false;
  }catch(e){
    console.error('push error',e);
    setSyncStatus('error','同步失败');
  }
}

/* Debounced auto-push after any write */
function schedulePush(){
  pendingSync=true;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{if(pendingSync)pushToCloud();},2000);
}

function manualSync(){
  if(!currentUser){showToast('请先登录');return;}
  pushToCloud().then(()=>pullFromCloud());
}

/* ── Override persist to also schedule cloud push ── */
function persist(){
  persistLocal();
  schedulePush();
}
function persistLocal(){
  try{
    localStorage.setItem(STORE,JSON.stringify(entries));
    localStorage.setItem(STORE_ARC,JSON.stringify(archive));
    localStorage.setItem(STORE_META,JSON.stringify(meta));
  }catch(e){}
}

/* ── App boot ── */
async function initApp(){
  applyTheme(getAutoTheme());
  // Check existing session
  const{data:{session}}=await sb.auth.getSession();
  if(session){
    currentUser=session.user;
    hideAuthOverlay();
    load(); // load local first for instant display
    renderDate();renderFiltered();renderQuickMoodEnergy();initCal();
    setSyncStatus('syncing','同步中…');
    await pullFromCloud(); // then sync from cloud
  }else{
    document.getElementById('authLoading').style.display='none';
    const form=document.getElementById('authForm');
    form.style.display='flex';
    showAuthTab('login');
    // still load local data
    load();renderDate();renderFiltered();renderQuickMoodEnergy();initCal();
  }
  // Listen for auth changes
  sb.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_IN'&&session){
      currentUser=session.user;
      hideAuthOverlay();
      setSyncStatus('syncing','同步中…');
      await pullFromCloud();
      showToast('登录成功 ✓');
    }else if(event==='SIGNED_OUT'){
      currentUser=null;
      setSyncStatus('','离线');
    }
  });
}

if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
initApp();
